name: R Tests

on:
  schedule:
    - cron: '0 0 * * *'  # midnight UTC daily
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install ".[test]"

      - uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("reticulate", "testthat", "remotes"), repos = "https://cloud.r-project.org")'
          Rscript -e 'remotes::install_github("starsimhub/rstarsim")'

      - name: Run tests
        run: Rscript -e "testthat::test_file('tests/test_model.R')"
        env:
          RETICULATE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
