name: Python Tests

on:
  schedule:
    - cron: '0 0 * * *'  # midnight UTC daily
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ".[test]"

      - name: Run tests
        run: pytest -v
